name: watch

on:
  schedule:
    # Eine Session über die US-Handelszeit. GitHub lässt einzelne 15-Minuten-Ticks aus.
    - cron: "30 13 * * 1-5"
    - cron: "0 16 * * 1-5"
    - cron: "25 19 * * 1-5"
    # Nachts und am Wochenende ein Blick, keine neue Position.
    - cron: "17 0,4,8 * * *"
    - cron: "47 2,6,10,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Beobachten
        run: |
          set +e
          git config user.name "vesper-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          start=$(date +%s)
          while true; do
            out=$(npx tsx src/watch.ts 2>&1)
            printf '%s\n' "$out" | tail -n 40
            git add data/watch.json data/journal-main.jsonl data/journal-hebel.jsonl
            git diff --cached --quiet || git commit -m "watch $(date -u +%FT%TZ)"
            git pull --rebase --autostash || true
            git push || true
            hm=$(date -u +%H)
            mi=$(date -u +%M)
            mins=$((10#$hm * 60 + 10#$mi))
            dow=$(date -u +%u)
            now=$(date +%s)
            elapsed=$((now - start))
            # Handelszeit: jede Minute, bis 20:05 UTC oder 350 Minuten.
            if [ "$dow" -le 5 ] && [ "$mins" -ge 810 ] && [ "$mins" -lt 1205 ]; then
              if [ "$elapsed" -ge $((350 * 60)) ]; then break; fi
              sleep 60
              continue
            fi
            # Nacht und Wochenende: alle 30 Minuten, höchstens 5,5 Stunden.
            # Kurz vor 13:25 UTC aufhören, damit die Handels-Session übernehmen kann.
            if [ "$dow" -le 5 ] && [ "$mins" -ge 785 ] && [ "$mins" -lt 810 ]; then break; fi
            if [ "$elapsed" -ge $((330 * 60)) ]; then break; fi
            sleep 1800
          done
